name: Bug report / 问题报告
description: Report a reproducible problem without exposing private device data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve CunJi. Do not include disk serial numbers, UUIDs, UDIDs, full local paths, raw unredacted SMART exports, credentials, or private files.

        感谢你帮助改进「存迹」。请勿提交硬盘序列号、UUID、UDID、完整本机路径、未经脱敏的 SMART 原始导出、凭据或私人文件。
  - type: input
    id: version
    attributes:
      label: App version and build / App 版本与 build
      placeholder: 0.2.0 (build 6)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac model / macOS 与 Mac 型号
      placeholder: macOS 15.x, Apple Silicon model
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Disk or enclosure type / 硬盘或硬盘盒类型
      description: Do not include serial numbers.
      placeholder: Internal Apple SSD, NVMe in RTL9210 enclosure, etc.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: Provide the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence / 已脱敏证据
      description: Screenshots or logs must remove device identifiers and private paths.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I removed serial numbers, UUIDs, UDIDs, private paths, credentials, and other identifying data.
          required: true
